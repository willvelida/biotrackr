name: Dev Container Check

on:
    pull_request:
        branches:
            - main
        paths:
            - '.devcontainer/**'
            - 'docs/devcontainer-setup.md'
            - 'docs/development.md'
            - 'scripts/check-devcontainer.sh'
            - '.github/workflows/devcontainer-check.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: devcontainer-check-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Check Dev Container Consistency
        runs-on: ubuntu-latest
        steps:
            # Full history: the check compares the PR head against the base, so a
            # shallow clone would leave the merge base unreachable.
            - name: Checkout repository
              uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
              with:
                fetch-depth: 0
                persist-credentials: false

            # BASE_REF goes through env rather than a ${{ }} expansion inside the
            # script: interpolating a ref name straight into a shell command is a
            # code-injection vector (zizmor template-injection).
            - name: Check dev container consistency
              env:
                BASE_REF: ${{ github.base_ref || 'main' }}
              run: |
                base="origin/${BASE_REF}"
                if git rev-parse --verify --quiet "$base" >/dev/null; then
                  bash scripts/check-devcontainer.sh --range "$base...HEAD"
                else
                  bash scripts/check-devcontainer.sh --all
                fi
