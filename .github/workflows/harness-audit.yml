name: Harness Audit

on:
    pull_request:
        branches:
            - main
        paths:
            - 'AGENTS.md'
            - '.github/copilot-instructions.md'
            - '.github/agents/**'
            - '.github/instructions/**'
            - '.github/prompts/**'
            - '.github/skills/**'
            - 'docs/harness-guide.md'
            - 'scripts/audit-harness.sh'
            - '.github/workflows/harness-audit.yml'
            # The runtime layer. Until these were listed, a change to a git hook,
            # a hook registration, or the shared sensor could not trigger the
            # audit at all — the checks that cover them never ran on the PR that
            # broke them.
            - '.githooks/**'
            - '.github/hooks/**'
            - '.claude/settings.json'
            - 'scripts/verify.sh'
            - 'scripts/init.sh'
            - 'scripts/agent-post-edit.sh'
            - 'scripts/observability.sh'
            - 'scripts/observability.test.sh'
            - 'scripts/audit-harness.test.sh'
            # Checks C7 and C8 read these, so a schema or measurement change
            # should be audited by the PR that makes it.
            - '.copilot-tracking/harness-evolution-log.md'
            - '.copilot-tracking/harness-evolution-metrics.md'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: harness-audit-${{ github.ref }}
    cancel-in-progress: true

jobs:
    audit:
        name: Audit Agent Harness
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
              with:
                persist-credentials: false

            # The audit's checks are only as trustworthy as the suites that
            # prove them. Listing the suites under `paths:` triggered this
            # workflow but never ran them, so a broken suite would have reached
            # main behind a green check — precisely the "a check that never runs
            # is indistinguishable from one that passes" failure this layer
            # exists to make visible. Not advisory: these are deterministic
            # self-tests, so a failure is a defect, not a ratchet.
            - name: Run harness self-tests
              run: |
                set -o pipefail
                bash scripts/observability.test.sh
                bash scripts/audit-harness.test.sh

            # Advisory while the audit builds a green history. Promote it to a hard
            # gate by deleting continue-on-error, not by editing the script.
            - name: Run harness audit
              continue-on-error: true
              run: |
                set -o pipefail
                bash scripts/audit-harness.sh --json --json-out audit-results.json | tee audit.log

            - name: Publish audit summary
              if: always()
              run: |
                {
                  echo '## Harness audit'
                  echo ''
                  echo '```text'
                  cat audit.log 2>/dev/null || echo 'The audit produced no output.'
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"

            # The step summary is ephemeral and cannot be compared between runs.
            # Retaining both forms makes drift observable over time: the log for
            # a human reading one run, the JSON for anything trending several.
            # The JSON is written from the audit's exit trap, so it exists even
            # when a CRITICAL check fails the run.
            - name: Upload audit results
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                name: harness-audit-${{ github.run_id }}
                path: |
                  audit.log
                  audit-results.json
                if-no-files-found: warn
                retention-days: 90
